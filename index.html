<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Book Tracker</title>

<style>

body {

    color: black;

    font-family: Arial, sans-serif;

    background-color: #f2f2f2;

    margin: 0;

    padding: 20px;

}

h1 {

    text-align: center;

    color: #2c3e50;

}

.box {

    background-color: white;

    max-width: 800px;

    margin: 15px auto;

    padding: 15px;

    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);

}

input {

    width: 100%;

    padding: 10px;

    margin-bottom: 10px;

    border: 1px solid #aaa;

    border-radius: 4px;

    box-sizing: border-box;

    font-size: 15px;

}

button {

    padding: 8px 14px;

    border: none;

    border-radius: 4px;

    color: white;

    cursor: pointer;

    font-size: 14px;

    background-color: #2c3e50;

}

#cancelBtn {

    display: none;

    background-color: gray;

}
#error {

    color: red;

    margin: 0 0 10px 0;

}

table {

    width: 100%;

    border-collapse: collapse;

}

th, td {

    padding: 8px;

    text-align: left;

    border-bottom: 1px solid #ddd;

}

th {

    background-color: #2c3e50;

    color: white;

}

.available {

    color: green;

    font-weight: bold;

}

.borrowed {

    color: red;

    font-weight: bold;
}

.status-btn {

    background-color: #2980b9;

}

.edit-btn {

    background-color: #f39c12;

}

.delete-btn {

    background-color: #c0392b;

}

#emptyMsg {

    text-align: center;

    color: gray;

}

@media (max-width: 600px) {

    body {

        padding: 10px;

    }

    .box {

        overflow-x: auto;

    }

    th, td {

        font-size: 13px;

        padding: 6px;
    }

    td button {

        margin-bottom: 4px;

    }

}

</style>

</head>

<body>

    <h1>Library Book Tracker</h1>



    <div class="box">

        <h2 id="formTitle">Add a Book</h2>

        <input type="text" id="bookId" placeholder="Book ID">

        <input type="text" id="title" placeholder="Title">

        <input type="text" id="author" placeholder="Author">

        <p id="error"></p>

        <button id="saveBtn" onclick="saveBook()">Add Book</button>

        <button id="cancelBtn" onclick="cancelEdit()">Cancel</button>

    </div>



    <div class="box">

        <input type="text" id="searchBox" placeholder="Search by title or author"
onkeyup="showBooks()">

    </div>
 <div class="box">

  <h2>All Books</h2>

  <table>

   <thead>

    <tr>

     <th>ID</th>

     <th>Title</th>

     <th>Author</th>

     <th>Status</th>

     <th>Actions</th>

    </tr>

   </thead>

   <tbody id="bookList"></tbody>

  </table>

  <p id="emptyMsg">No books found.</p>

 </div>



<script>

var books = [];

var editingIndex = -1;



// load saved books from localStorage

function loadBooks() {
    var saved = localStorage.getItem("books");

    if (saved) {

        books = JSON.parse(saved);

    }

}



// save books to localStorage

function saveToStorage() {

    localStorage.setItem("books", JSON.stringify(books));

}



// stops user text from breaking the page

function safe(text) {

    var div = document.createElement("div");

    div.innerText = text;

    return div.innerHTML;

}



// show all books (or only the searched ones)

function showBooks() {

    var list = document.getElementById("bookList");

    var search = document.getElementById("searchBox").value.toLowerCase();

    var count = 0;

    list.innerHTML = "";
 for (var i = 0; i < books.length; i++) {

  var b = books[i];

  if (b.title.toLowerCase().indexOf(search) == -1 &&

       b.author.toLowerCase().indexOf(search) == -1) {

      continue;

  }

  count++;



  var statusClass = "available";

  if (b.status == "Borrowed") {

      statusClass = "borrowed";

  }



  list.innerHTML += "<tr>" +

      "<td>" + safe(b.id) + "</td>" +

      "<td>" + safe(b.title) + "</td>" +

      "<td>" + safe(b.author) + "</td>" +

      "<td class='" + statusClass + "'>" + b.status + "</td>" +

      "<td>" +

      "<button class='status-btn' onclick='changeStatus(" + i + ")'>Change Status</button> " +

      "<button class='edit-btn' onclick='editBook(" + i + ")'>Edit</button> " +

      "<button class='delete-btn' onclick='deleteBook(" + i + ")'>Delete</button>" +
         "</td>" +

         "</tr>";

    }



    if (count == 0) {

        document.getElementById("emptyMsg").style.display = "block";

    } else {

        document.getElementById("emptyMsg").style.display = "none";

    }

}



// add a new book or save an edited book

function saveBook() {

    var id = document.getElementById("bookId").value.trim();

    var title = document.getElementById("title").value.trim();

    var author = document.getElementById("author").value.trim();

    var error = document.getElementById("error");



    // check empty fields

    if (id == "" || title == "" || author == "") {

        error.innerText = "Please fill in all the fields.";

        return;

    }
    // check if the ID is already used

    for (var i = 0; i < books.length; i++) {

        if (books[i].id == id && i != editingIndex) {

            error.innerText = "This Book ID is already used.";

            return;

        }

    }



    if (editingIndex == -1) {

        // new book

        books.push({ id: id, title: title, author: author, status: "Available" });

    } else {

        // edit old book

        books[editingIndex].id = id;

        books[editingIndex].title = title;

        books[editingIndex].author = author;

    }



    saveToStorage();

    clearForm();

    showBooks();

}



// put the book details back in the form so user can edit
function editBook(index) {

    editingIndex = index;

    document.getElementById("bookId").value = books[index].id;

    document.getElementById("title").value = books[index].title;

    document.getElementById("author").value = books[index].author;

    document.getElementById("formTitle").innerText = "Edit Book";

    document.getElementById("saveBtn").innerText = "Save Changes";

    document.getElementById("cancelBtn").style.display = "inline-block";

    document.getElementById("error").innerText = "";

}



function cancelEdit() {

    clearForm();

}



// delete a book

function deleteBook(index) {

    var sure = confirm("Do you want to delete this book?");

    if (sure) {

        books.splice(index, 1);

        saveToStorage();

        clearForm();

        showBooks();

    }
}



// switch between Available and Borrowed

function changeStatus(index) {

    if (books[index].status == "Available") {

        books[index].status = "Borrowed";

    } else {

        books[index].status = "Available";

    }

    saveToStorage();

    showBooks();

}



// empty the form and go back to Add mode

function clearForm() {

    document.getElementById("bookId").value = "";

    document.getElementById("title").value = "";

    document.getElementById("author").value = "";

    document.getElementById("error").innerText = "";

    document.getElementById("formTitle").innerText = "Add a Book";

    document.getElementById("saveBtn").innerText = "Add Book";

    document.getElementById("cancelBtn").style.display = "none";

    editingIndex = -1;

}
// run when the page opens

loadBooks();

showBooks();

</script>

</body>

</html>
